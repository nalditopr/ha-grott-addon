name: Grott
version: "0.6.6"
slug: grott
description: Local proxy + MQTT bridge for Growatt solar inverters
url: https://github.com/nalditopr/ha-grott-addon/tree/main/grott
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
  - i386
init: false
startup: services
boot: auto
host_network: false
ports:
  5279/tcp: 5279
  5782/tcp: 5782
ports_description:
  5279/tcp: Datalogger ingress — point the Growatt stick here
  5782/tcp: Grott HTTP API
services:
  - mqtt:need
options:
  forward_to_cloud: false
  growatt_cloud_host: server.growatt.com
  growatt_cloud_port: 5279
  grott_listen_port: 5279
  http_api_port: 5782
  mqtt_topic: energy/growatt
  mqtt_retain: false
  verbose: true
  debug_hex: false
  mitm_upstream_host: ""
  mitm_upstream_port: 22015
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  extra_ini: ""
schema:
  forward_to_cloud: bool
  growatt_cloud_host: str
  growatt_cloud_port: port
  grott_listen_port: port
  http_api_port: port
  mqtt_topic: str
  mqtt_retain: bool
  verbose: bool
  debug_hex: bool
  mitm_upstream_host: str?
  mitm_upstream_port: port?
  mqtt_host: str?
  mqtt_port: port?
  mqtt_user: str?
  mqtt_password: password?
  extra_ini: str?
